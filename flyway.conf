# For Docker or Podman setups replace fantasy-ai-db.orb.local with localhost
flyway.url=jdbc:postgresql://fantasy-ai-db.orb.local:5432/fantasy_db
flyway.user=fantasy_user
flyway.password=fantasy_password
flyway.locations=filesystem:src/main/resources/db/migration
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql
flyway.cleanDisabled=false
